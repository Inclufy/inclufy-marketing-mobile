# SonarQube scan config voor AMOS (Inclufy Marketing — mobile).
# Gescand door .github/workflows/sonarqube.yml en pusht naar de Control
# Tower SonarQube (SONAR_HOST_URL / SONAR_TOKEN als CI-secrets).
#
# ⚠️  projectKey MOET exact matchen met het bestaande project in jouw
#     SonarQube ("Marketing (mobile)"), anders maakt de scanner een NIEUW
#     project aan i.p.v. het bestaande bij te werken. De key staat in de
#     project-URL: .../dashboard?id=<DEZE-KEY> of in Project Settings.
#     Pas onderstaande key aan als die afwijkt.
sonar.projectKey=inclufy-marketing-mobile
sonar.projectName=Marketing (mobile)

# Scan de hele repo, maar sluit gevendorde / gegenereerde / niet-app code uit.
# - inclufy-go/  : oudere GENESTE kopie van de app → blaast duplicatie op (was 45.8%)
# - backend*/    : losse Python-backend incl. venv → niet de mobiele app
# - _archive/    : gearchiveerde Next.js web-dashboard (zie .gitlab-ci.yml)
# - ios/ android/: native build-output
sonar.sources=.
sonar.exclusions=\
  node_modules/**,\
  inclufy-go/**,\
  backend/**,\
  backend.backup/**,\
  _archive/**,\
  ios/**,\
  android/**,\
  public/**,\
  assets/**,\
  dist/**,\
  scripts/**,\
  ci_scripts/**,\
  workers/**,\
  e2e/**,\
  **/*.min.js,\
  package-lock.json,\
  deno.lock

# Tests + coverage (jest → lcov). Lost de 0%-coverage op het dashboard op.
sonar.tests=src/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  src/__tests__/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  e2e/**

sonar.sourceEncoding=UTF-8
