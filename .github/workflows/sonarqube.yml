name: SonarQube

# Pusht code-kwaliteit (bugs / vulns / smells / coverage / duplicatie) naar
# de Control Tower SonarQube. Maakt findings reproduceerbaar buiten de
# host-side scan op de Mac Studio.
#
# Draait op een SELF-HOSTED runner óp de Mac Studio, zodat de SonarQube-server
# op http://localhost:9000 direct bereikbaar is (een GitHub-hosted runner kan
# die private URL niet bereiken).
#
# Eenmalige setup van de runner (Mac Studio):
#   Repo → Settings → Actions → Runners → "New self-hosted runner" (macOS),
#   volg de install-stappen en start 'm (`./run.sh` of als service via
#   `./svc.sh install && ./svc.sh start`). Label `self-hosted` is default.
#
# Vereiste repo-secrets (Settings → Secrets and variables → Actions):
#   SONAR_TOKEN     — analysis-token uit SonarQube (My Account > Security > Tokens)
#   SONAR_HOST_URL  — optioneel; default http://localhost:9000 (zie hieronder)
#
# Zonder SONAR_TOKEN wordt de scan overgeslagen (blokkeert andere PR's niet).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonarqube:
    # Self-hosted runner op de Mac Studio → localhost:9000 bereikbaar.
    runs-on: [self-hosted]
    # Skip op forks (secrets zijn daar niet beschikbaar).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Volledige history → accurate "new code" / blame voor SonarQube.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Coverage best-effort: een falende test mag de scan niet blokkeren,
      # we willen de lcov-rapportage hoe dan ook uploaden.
      - name: Tests + coverage
        run: npm run test:coverage -- --ci || true

      - name: Guard — SONAR_TOKEN aanwezig?
        id: guard
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN niet ingesteld — SonarQube-scan overgeslagen."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube scan
        if: steps.guard.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Default naar de lokale server op de Mac Studio; override via secret
          # als SonarQube op een ander adres/poort draait.
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'http://localhost:9000' }}
