# Supabase project config
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "InclufyMarketing"

# ═══════════════════════════════════════════════════════
# Edge Functions
# ═══════════════════════════════════════════════════════

# oauth-callback: verify_jwt must be FALSE.
# OAuth providers (LinkedIn, Meta, TikTok) redirect the user's browser to this
# endpoint after auth. The redirect is a top-level navigation from the
# provider's domain — no Authorization header is (or can be) attached.
# If verify_jwt is true, the Supabase gateway rejects the callback with
# UNAUTHORIZED_NO_AUTH_HEADER before our code runs, and OAuth is impossible.
[functions.oauth-callback]
verify_jwt = false

# publish-social: verify_jwt MUST stay true.
# Requests come from the authenticated mobile app with a user JWT. The
# function additionally asserts body.user_id matches the JWT subject to
# prevent service-role auth bypass (see commit f7b54b4 fix).
[functions.publish-social]
verify_jwt = true

[functions.product-issues]
verify_jwt = true

# send-email: server-to-server helper called by other edge functions
# (notify-issue-reported). The new Supabase API-key system no longer exposes
# the legacy JWT in auto-injected env vars, so the gateway rejects internal
# calls from sibling functions with INVALID_JWT_FORMAT. This function holds
# no PII and just forwards to Resend, so disabling verify_jwt is safe.
[functions.send-email]
verify_jwt = false

# notify-issue-reported: invoked by Supabase Database Webhook on
# product_issues INSERT. Webhooks send a service-role bearer the gateway
# accepts, so verify_jwt stays true.
[functions.notify-issue-reported]
verify_jwt = true

# record-consent: writes immutable consent_log rows. verify_jwt=false
# because cookie-banner / landing-page consent fires BEFORE signup (no
# JWT yet). When called WITH a Bearer JWT the function prefers that
# user_id over body.user_id to prevent consent-spoofing.
[functions.record-consent]
verify_jwt = false

# resend-webhook: receives delivery events from Resend (delivered, bounced,
# complained, opened, clicked). Resend posts unauthenticated requests but
# signs them via Svix headers — the function verifies the signature itself.
# verify_jwt must be FALSE because Resend has no Supabase JWT to send.
[functions.resend-webhook]
verify_jwt = false

# register-push-token: called by mobile app on cold-start with the user's
# JWT. We need verify_jwt to extract user_id from the bearer.
[functions.register-push-token]
verify_jwt = true

# send-push: server-to-server fan-out helper, called by triggers and other
# edge functions using service-role auth. Same rationale as send-email —
# no user JWT involved, no PII in request body beyond the user IDs already
# scoped by the caller.
[functions.send-push]
verify_jwt = false

# submit-post-for-approval: called by the post author (mobile/web) — needs
# user JWT to identify caller and check membership.
[functions.submit-post-for-approval]
verify_jwt = true

# process-post-approval: called by an admin/owner of the org — also needs
# user JWT for the role check.
[functions.process-post-approval]
verify_jwt = true

# gdpr-account-delete: GDPR Art. 17 — user-initiated. JWT required to
# identify the user being deleted. 3-tier: hard-delete strictly personal
# tables, preserve org content, anonymize profile + ban auth user.
[functions.gdpr-account-delete]
verify_jwt = true

# gdpr-export: GDPR Art. 15 — JSON export of user's personal data across
# ~30 user-scoped tables. Used by both AMOS mobile and marketing-web.
[functions.gdpr-export]
verify_jwt = true

# product-issue-lifecycle: Database Webhook receiver for product_issues
# INSERT/UPDATE events. Sends Resend emails for new/progress/resolved +
# AI-escalation to superadmins when triage can't auto-resolve. JWT off
# because Supabase Database Webhooks deliver with a shared secret in
# the Authorization header, not a user token.
[functions.product-issue-lifecycle]
verify_jwt = false

# triage-product-issues: automated ProductIssue triage (ProjeXtPal pattern port).
# Phase A catalog cross-match + Phase B OpenAI classify, dual public/internal
# comments, one digest email. JWT off — the fn authorizes itself via the
# service-role bearer (pg_cron, migration 20260603120000) or X-Triage-Token
# (manual curl). Never called from a user token.
[functions.triage-product-issues]
verify_jwt = false

# growth-blueprint: synchronous website scan + AI analysis for the
# marketing-web Growth Blueprint feature. Called from authenticated SPA
# (sami@inclufy.com etc.), so JWT required. Uses OpenAI gpt-4o-mini.
[functions.growth-blueprint]
verify_jwt = true

# ai-chat: generic conversational endpoint for the AICopilot widget in
# the marketing-web SPA. Takes {messages, system_prompt}, returns
# {response}. Uses OpenAI gpt-4o-mini, rate-limited via shared middleware.
[functions.ai-chat]
verify_jwt = true

# ═══════════════════════════════════════════════════════
# Phase D — 17 newly-deployed edge fns (2026-05-24)
# All require a user JWT (verify_jwt = true) except payments-plans
# which is a public read of the pricing catalogue.
# ═══════════════════════════════════════════════════════

# AI content family — OpenAI gpt-4o-mini, rate-limited per user.
[functions.ai-write]
verify_jwt = true
[functions.ai-image]
verify_jwt = true
# sales-chat: landing-page chat widget for ANONYMOUS prospects. Must be
# public — gating on JWT would 401 every visitor before they sign up. Fn
# itself uses a per-IP soft rate-limit via the shared middleware.
[functions.sales-chat]
verify_jwt = false
[functions.content-social]
verify_jwt = true
[functions.content-email]
verify_jwt = true
[functions.content-improve]
verify_jwt = true
[functions.content-analyze-url]
verify_jwt = true
[functions.generate-mascot]
verify_jwt = true

# Setup-agent orchestrator — multi-action AI for onboarding.
[functions.setup-agent]
verify_jwt = true

# Pricing — public read so anonymous visitors see plans on /pricing.
[functions.payments-plans]
verify_jwt = false

# Stripe checkout — caller must be authenticated so the subscription
# is tied to their user_id; STRIPE_SECRET_KEY must be set in secrets.
[functions.create-checkout]
verify_jwt = true

# Bulk email — Resend API. Caller-scoped, rate via Resend's own quotas.
[functions.email-send-campaign]
verify_jwt = true

# Contacts CSV/JSON import. User-scoped via JWT.
[functions.contacts-import]
verify_jwt = true

# Admin functions — superadmin gate enforced inside each fn via
# SUPERADMIN_EMAILS env var (additional to JWT).
[functions.admin-create-user]
verify_jwt = true
[functions.admin-delete-user]
verify_jwt = true
[functions.admin-invite]
verify_jwt = true

# Seed demo content into the caller's organization.
[functions.seed-demo-content]
verify_jwt = true

# oauth-init: builds the provider-specific OAuth authorization URL server-side
# so the marketing-web SPA can start the connect flow for 6 platforms (LinkedIn,
# Facebook, Instagram, TikTok, Pinterest, Threads). Caller must be authenticated
# so we can scope state to the caller's user_id + organization_id.
[functions.oauth-init]
verify_jwt = true

# api-key-mint: mints a new long-lived API key for an organization. The plain
# key is returned ONCE; only SHA-256 hash is persisted. Caller must be
# owner/admin of the target org (RLS + re-check inside the fn).
[functions.api-key-mint]
verify_jwt = true

# api-key-verify: verifies a presented sk_inclufy_ key against api_keys.
# verify_jwt = false because the API key IS the credential — no end-user
# JWT is present in third-party ingress. Used (a) as a standalone endpoint
# for ingress gateways and (b) as an importable helper from other edge fns
# that want to accept API-key auth.
[functions.api-key-verify]
verify_jwt = false

# webhooks-dispatch: drains the webhook_deliveries queue and POSTs each
# pending payload to the customer URL with HMAC-SHA256 signature. Three
# modes: drain (empty body), specific delivery (body.webhook_delivery_id),
# enqueue + drain (body.enqueue + body.organization_id). Service-role
# only — verify_jwt = false so a cron trigger can call it without a user
# JWT, but every code path requires the service_role key in the auth
# header (enforced by config below + per-mode checks in the fn itself).
[functions.webhooks-dispatch]
verify_jwt = false

# mfa-recovery-generate: mints 8 single-use recovery codes for the user
# in case they lose their TOTP device. Caller must already be aal2 to
# prevent a password-only attacker from minting fresh codes.
[functions.mfa-recovery-generate]
verify_jwt = true

# mfa-recovery-consume: verifies a recovery code at login time when the
# user can't access their authenticator app. Marks the row used and
# returns codes_remaining count.
[functions.mfa-recovery-consume]
verify_jwt = true

# finance-invoice-sync: server-to-server bridge to the Inclufy Finance app.
# Triggered by DB trigger on invoices INSERT (also callable manually from
# AdminInvoices). Sends invoice to FINANCE_APP_BASE_URL/api/invoices/intake
# with FINANCE_INTAKE_SECRET bearer. verify_jwt=false because the DB trigger
# uses pg_net which doesn't carry a user JWT.
[functions.finance-invoice-sync]
verify_jwt = false

# send-sandbox-invitation: invites a prospect to a time-boxed sandbox
# workspace pre-seeded with industry-pack data (Linear/Stripe sales pattern).
# verify_jwt = true because the caller (org owner/admin) must be authenticated.
[functions.send-sandbox-invitation]
verify_jwt = true
